# File edits are allowed only inside a linked worktree supplied by the caller.
# Shell, web, MCP, agent, memory, and skill tools are excluded from discovery.
[[rule]]
toolName = "*"
decision = "deny"
priority = 997

[[rule]]
toolName = ["read_file", "list_directory", "grep_search", "glob", "replace", "write_file"]
decision = "allow"
priority = 998

[[rule]]
toolName = ["read_file", "write_file", "replace"]
argsPattern = '"file_path"\s*:\s*"[^"]*(\.env|oauth_creds\.json|gemini-credentials\.json|credentials\.json|\.pem|\.key)'
decision = "deny"
priority = 999
